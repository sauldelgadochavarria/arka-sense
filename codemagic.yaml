# Codemagic — monorepo ArkaSense
# La app Flutter NO está en la raíz: apps/arka_sense_asistencia
#
# IMPORTANTE en la UI de Codemagic:
# 1) "Switch to YAML configuration" y elige este archivo, O
# 2) Si usas Workflow Editor → Build → Project path = apps/arka_sense_asistencia
#    (botón Rescan junto al dropdown si no aparece)

workflows:
  arka-sense-asistencia-ios:
    name: ArkaSense Asistencia (iOS)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Clave monorepo: todo corre dentro de la app Flutter
    working_directory: apps/arka_sense_asistencia
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: http://192.168.1.11:4003
    scripts:
      - name: Get Flutter packages
        script: |
          echo "PWD=$(pwd)"
          ls -la pubspec.yaml
          flutter pub get
      - name: Install CocoaPods
        working_directory: apps/arka_sense_asistencia/ios
        script: |
          pod install
      - name: Flutter build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - apps/arka_sense_asistencia/build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - saul_dc@hotmail.com
        notify:
          success: true
          failure: true

  arka-sense-asistencia-android:
    name: ArkaSense Asistencia (Android)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: apps/arka_sense_asistencia
    environment:
      flutter: stable
      vars:
        API_BASE_URL: http://192.168.1.11:4003
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build APK
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - apps/arka_sense_asistencia/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - saul_dc@hotmail.com
        notify:
          success: true
          failure: true
