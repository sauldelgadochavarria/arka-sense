# Codemagic — monorepo ArkaSense
# App Flutter: apps/arka_sense_asistencia
#
# OBLIGATORIO en Codemagic (aunque uses YAML):
#   App settings → Build → Project path → Rescan → elegir
#   apps/arka_sense_asistencia
# Si Project path queda en ".", el paso automático
# "== Install Flutter dependencies ==" falla en /Users/builder/clone
#
# Al iniciar build: selecciona el workflow YAML
# "ArkaSense Asistencia (iOS)" (no el workflow del Editor).

workflows:
  arka-sense-asistencia-ios:
    name: ArkaSense Asistencia (iOS)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/arka_sense_asistencia
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: http://192.168.1.11:4003
    scripts:
      - name: Verify Flutter project path
        script: |
          set -e
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"
          echo "PWD=$(pwd)"
          test -f pubspec.yaml
          test -d ios
          head -5 pubspec.yaml
      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get
      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install
      - name: Flutter build iOS (no codesign)
        script: |
          set -e
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - apps/arka_sense_asistencia/build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - saul_dc@hotmail.com
        notify:
          success: true
          failure: true

  arka-sense-asistencia-android:
    name: ArkaSense Asistencia (Android)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: apps/arka_sense_asistencia
    environment:
      flutter: stable
      vars:
        API_BASE_URL: http://192.168.1.11:4003
    scripts:
      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get
      - name: Flutter build APK
        script: |
          set -e
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - apps/arka_sense_asistencia/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - saul_dc@hotmail.com
        notify:
          success: true
          failure: true
