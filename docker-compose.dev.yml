services:
  mongo:
    image: mongo:7
    networks:
      - base_saas_net
    ports:
      - "27020:27017"
    volumes:
      - base_saas_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  base-admin:
    networks:
      - base_saas_net
    build:
      context: ./services/base-admin
      dockerfile: Dockerfile.dev
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/config
      - BASE_INTERNAL_API_KEY=dev-internal-key-cambiar-en-produccion
      - BASE_ADMIN_AUTH_USER=admin
      - BASE_ADMIN_AUTH_PASSWORD=admin123
      - BASE_ADMIN_ALLOWED_IPS=127.0.0.1,::1,172.16.0.0/12,192.168.65.0/24,10.0.0.0/8
      - TENANT_BASE_DOMAIN=localhost:4003
      - TENANT_APP_PROTOCOL=http
    volumes:
      - ./services/base-admin:/app
      - base_admin_node_modules:/app/node_modules
    ports:
      - "4004:3000"

  base-saas:
    networks:
      - base_saas_net
    build:
      context: ./services/base-saas
      dockerfile: Dockerfile.dev
    depends_on:
      mongo:
        condition: service_healthy
      base-admin:
        condition: service_started
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/config
      - BASE_INTERNAL_API_KEY=dev-internal-key-cambiar-en-produccion
      - BASE_SESSION_SECRET=dev-session-secret-cambiar-en-produccion
      - BASE_ADMIN_URL=http://base-admin:3000
      - TENANT_RESOLUTION_ENABLED=true
      - TENANT_ALLOW_QUERY_ACCOUNT=true
    volumes:
      - ./services/base-saas:/app
      - base_saas_node_modules:/app/node_modules
      - base_saas_documentos:/data/documentos
    ports:
      - "4003:3000"

networks:
  base_saas_net:

volumes:
  base_saas_mongo_data:
  base_admin_node_modules:
  base_saas_node_modules:
  base_saas_documentos:
